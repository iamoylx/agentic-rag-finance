[pytest]
# 目录约定：pytest 用例只放 tests/；scripts/ 下是「可独立运行的验证脚本」。
#
# scripts/ 里的 test_*.py（test_graph.py / test_hybrid.py / test_sse_reset.py /
# test_regen_reset.py）不是 pytest 用例：它们有 __main__ 入口、要起真实 engine，
# 其中 async 函数也没有 pytest-asyncio 标记。
# 不限定 testpaths 时，裸跑 pytest 会把这些脚本一并收走，
# scripts/test_sse_reset.py 会报 2 个 "async def functions are not natively supported" 失败
# ——那是收集误伤，不是真 bug。
#
# 用法：
#   .venv/Scripts/python.exe -m pytest              # 跑 tests/ 全部用例
#   .venv/Scripts/python.exe scripts/test_xxx.py    # 跑单个验证脚本
testpaths = tests
