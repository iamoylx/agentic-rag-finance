# 一键生产形态：api + mysql + redis
# 用法：docker compose up -d —— API 在 8300，对话落 MySQL(rag 库)，高频问答缓存走 Redis
# 密钥经环境注入（不写进镜像）；models/data 卷挂载，镜像保持轻量
services:
  api:
    build:
      context: .
      target: runtime       # 显式写出：Dockerfile 最后一个阶段就是 runtime
    ports:
      - "8300:8300"
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-agnes}
      AGNES_API_KEY: ${AGNES_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      MYSQL_URL: mysql+pymysql://rag:ragpass@mysql:3306/rag?charset=utf8mb4
      REDIS_URL: redis://redis:6379/0
      EMBED_DEVICE: cpu
    volumes:
      - ./models:/app/models:ro        # BGE-M3 / Reranker 权重（约 2GB，不进镜像）
      - ./data:/app/data               # 年报原始件 / 解析产物 / Chroma 索引
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      # 没有 healthcheck 时 `docker compose up --wait` 不会等 api（只等有 healthcheck 的），
      # 于是「一条命令起来」其实返回时服务还没 ready。用 python 而不是 curl：
      # python:3.12-slim 里没有 curl。
      test:
        - CMD
        - python
        - -c
        - |
          import sys, urllib.request
          try:
              ok = urllib.request.urlopen("http://127.0.0.1:8300/health", timeout=3).status == 200
          except Exception:
              ok = False
          sys.exit(0 if ok else 1)
      interval: 15s
      timeout: 5s
      retries: 8
      # 冷启动实测约 37s（读语料 26s + 建索引 11s，CPU），再留模型加载余量
      start_period: 120s
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-changeme-root}
      MYSQL_DATABASE: rag
      MYSQL_USER: rag
      MYSQL_PASSWORD: ragpass
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
